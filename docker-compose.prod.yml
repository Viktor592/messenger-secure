version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: messenger
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/backup.sh
    ports:
      - "127.0.0.1:5432:5432" # Only local access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - messenger_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (Production)
  redis:
    image: redis:7-alpine
    container_name: messenger_redis_prod
    restart: always
    command: |
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379" # Only local access
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - messenger_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messenger_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://messenger:${DB_PASSWORD}@postgres:5432/messenger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_ACCESS: 15m
      JWT_EXPIRE_REFRESH: 30d
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      API_URL: https://${DOMAIN}
      CORS_ORIGIN: https://${DOMAIN}
      LOG_LEVEL: info
      PORT: 3001
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 200
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: messenger_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - messenger_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"
    security_opt:
      - no-new-privileges:true

  # Certbot for SSL (Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: messenger_certbot_prod
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:rw
      - /var/lib/letsencrypt:/var/lib/letsencrypt:rw
    command: renew --quiet
    networks:
      - messenger_network
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  messenger_network:
    driver: bridge
