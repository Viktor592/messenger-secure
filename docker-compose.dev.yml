version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres_dev
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: messenger_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messenger_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: messenger_redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messenger_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: messenger_backend_dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://messenger:devpassword@postgres:5432/messenger_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3001,http://localhost:8081
      LOG_LEVEL: debug
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_node_modules:/app/node_modules
    networks:
      - messenger_network
    stdin_open: true
    tty: true

  # PgAdmin (optional, for DB management)
  pgadmin:
    image: dpage/pgadmin4
    container_name: messenger_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - messenger_network

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_node_modules:

networks:
  messenger_network:
    driver: bridge
